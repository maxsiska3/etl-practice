version: 2

models:
  - name: dim_artist__summary
    description: "Visualization ready table ready to integrate"
    columns:
      - name: artist_name
        description: "artist's name displayed"
        tests:
          - not_null
          - unique
      - name: sex
        description: "artist's gender"
      - name: country
        description: "where the artist is from"
      - name: language
        description: "what language the artist sings in"
      - name: primary_genre
        description: "what genre the artist primarily sings in"
      - name: artist_type
        description: "solo or group"
        tests:
          - accepted_values:
              arguments:
                values:
                  - Solo
                  - Group
      - name: total_streams_million
        description: "amount of total streams in millions"
        tests:
          - not_null
      - name: lead_streams_million
        description: "amount of lead streams in millions"
        tests:
          - not_null
      - name: feature_streams_million
        description: "amount of feature streams in millions"
        tests:
          - not_null
      - name: solo_streams_million
        description: "amount of lead streams in millions"
        tests:
          - not_null
